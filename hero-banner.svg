<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- ambient drifting glow -->
    <circle cx="950" cy="80" r="180" fill="url(#glow-core)">
      <animate attributeName="cx" values="950;1000;900;950" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- faint measurement grid -->
    <g stroke="#1c2740" stroke-width="1">
      <line x1="0" y1="70" x2="1200" y2="70"/>
      <line x1="0" y1="140" x2="1200" y2="140"/>
      <line x1="0" y1="210" x2="1200" y2="210"/>
      <line x1="0" y1="280" x2="1200" y2="280"/>
    </g>
    <g stroke="#141c30" stroke-width="1">
      <line x1="150" y1="0" x2="150" y2="340"/>
      <line x1="400" y1="0" x2="400" y2="340"/>
      <line x1="650" y1="0" x2="650" y2="340"/>
      <line x1="900" y1="0" x2="900" y2="340"/>
      <line x1="1150" y1="0" x2="1150" y2="340"/>
    </g>

    <!-- animated NIR absorbance trace, redrawing on loop -->
    <path id="trace" d="M -50 260
             C 20 255, 60 235, 110 240
             C 170 248, 210 175, 260 165
             C 310 156, 340 225, 390 230
             C 450 236, 490 115, 540 105
             C 590 96, 630 200, 680 206
             C 740 213, 780 70, 830 64
             C 880 58, 920 190, 970 196
             C 1020 202, 1060 128, 1110 122
             C 1150 118, 1190 205, 1250 210"
          fill="none" stroke="url(#spectrum)" stroke-width="3" filter="url(#blur1)"
          stroke-dasharray="1900" stroke-dashoffset="1900" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="1900;0;0;1900" keyTimes="0;0.45;0.85;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <use href="#trace" filter="url(#blur2)" opacity="0.35"/>

    <!-- sweeping scan line -->
    <rect x="-4" y="0" width="4" height="340" fill="#38bdf8" opacity="0.55">
      <animate attributeName="x" values="-4;1204" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <line x1="0" y1="255" x2="1200" y2="255" stroke="#233152" stroke-width="1"/>

    <!-- typed name -->
    <text x="60" y="150" font-family="Consolas, 'Fira Code', monospace" font-size="50" font-weight="700" fill="#f1f5f9">
      <tspan fill="#64748b">&gt; </tspan>DILSHAN<tspan fill="#38bdf8"> NARANKOTUWA</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
    </text>

    <!-- blinking cursor -->
    <rect x="905" y="112" width="16" height="42" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- typing tagline -->
    <text x="60" y="192" font-family="'Fira Code', monospace" font-size="19" fill="#94a3b8">
      data scientist — reading chemistry through machine learning
    </text>

    <!-- wavelength readout -->
    <text x="60" y="310" font-family="'Fira Code', monospace" font-size="13" fill="#4b5a78">900nm</text>
    <text x="1140" y="310" font-family="'Fira Code', monospace" font-size="13" fill="#4b5a78" text-anchor="end">1700nm</text>
    <text x="1140" y="35" font-family="'Fira Code', monospace" font-size="13" fill="#4b5a78" text-anchor="end">live absorbance scan</text>

    <!-- status dot -->
    <circle cx="70" cy="30" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="84" y="35" font-family="'Fira Code', monospace" font-size="13" fill="#34d399">open to work — EU</text>
  </g>
</svg>
