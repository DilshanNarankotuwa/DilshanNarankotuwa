<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#34d399" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#05070d"/>
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#233152" stroke-width="1"/>

  <!-- 6 skill "peaks" -->
  <g font-family="'Fira Code', monospace" font-size="13" fill="#94a3b8" text-anchor="middle">

    <rect x="60" y="230" width="130" height="0" fill="url(#bar1)" rx="4">
      <animate attributeName="height" from="0" to="165" dur="1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="230" to="65" dur="1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="125" y="255">chemometrics</text>
    <text x="125" y="55" fill="#7c3aed" font-weight="700">92%</text>

    <rect x="235" y="230" width="130" height="0" fill="url(#bar2)" rx="4">
      <animate attributeName="height" from="0" to="185" dur="1s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="230" to="45" dur="1s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="300" y="255">python / ML</text>
    <text x="300" y="35" fill="#38bdf8" font-weight="700">96%</text>

    <rect x="410" y="230" width="130" height="0" fill="url(#bar3)" rx="4">
      <animate attributeName="height" from="0" to="145" dur="1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="230" to="85" dur="1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="475" y="255">model deploy</text>
    <text x="475" y="75" fill="#34d399" font-weight="700">85%</text>

    <rect x="585" y="230" width="130" height="0" fill="url(#bar4)" rx="4">
      <animate attributeName="height" from="0" to="155" dur="1s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="230" to="75" dur="1s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="650" y="255">stat. validation</text>
    <text x="650" y="65" fill="#f59e0b" font-weight="700">88%</text>

    <rect x="760" y="230" width="130" height="0" fill="url(#bar5)" rx="4">
      <animate attributeName="height" from="0" to="120" dur="1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="230" to="110" dur="1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="825" y="255">sql / data eng</text>
    <text x="825" y="100" fill="#f472b6" font-weight="700">78%</text>

    <rect x="935" y="230" width="130" height="0" fill="url(#bar6)" rx="4">
      <animate attributeName="height" from="0" to="110" dur="1s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="y" from="230" to="120" dur="1s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="1000" y="255">systems / linux</text>
    <text x="1000" y="110" fill="#60a5fa" font-weight="700">72%</text>

  </g>
</svg>
